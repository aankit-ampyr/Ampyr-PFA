services:
  db:
    image: postgres:16
    container_name: parthenon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parthenon
      POSTGRES_USER: parthenon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parthenon_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parthenon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
